# PostgreSQL para desenvolvimento local. Credenciais vêm do arquivo .env (ver .env.example).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-managerfoot}
      POSTGRES_USER: ${DB_USER:-managerfoot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - managerfoot-pgdata:/var/lib/postgresql

volumes:
  managerfoot-pgdata:
