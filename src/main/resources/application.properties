spring.application.name=managerfoot

# Banco de dados: valores vêm de variáveis de ambiente (ver .env.example).
# A senha não tem valor padrão para não ficar registrada no repositório.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/managerfoot}
spring.datasource.username=${DB_USER:managerfoot}
spring.datasource.password=${DB_PASSWORD}

# Health check em /actuator/health; nenhum outro endpoint do Actuator exposto.
management.endpoints.web.exposure.include=health

# Link de cadastro de uso único (SPEC §3.4, rev. 24): validade em formato ISO-8601.
managerfoot.contas.validade-link=P7D

# Clube inicial (SPEC §3.2, rev. 15): sorteado entre os N de menor força da última divisão (provisório: 4).
managerfoot.jogo.candidatos-clube-inicial=4

# Ano da 1ª temporada de um jogo novo (SPEC §8.1.1, rev. 40); cada temporada soma um ano.
managerfoot.jogo.ano-inicial=2026

# Endereço da aplicação, usado para montar o link de cadastro (--gerar-link-cadastro).
managerfoot.url-base=${URL_BASE:http://localhost:8080}
