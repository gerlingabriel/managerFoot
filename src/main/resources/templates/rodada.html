<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeca(${e.copa != null ? e.copa : 'Rodada ' + e.rodada})}"></head>
<body>
<div class="campo campo-pagina">
<div class="pagina">

<div id="quadro" class="pilha-larga" th:attr="hx-get=@{/jogos/{id}/rodada(id=${e.jogoId})},
		hx-trigger=${e.comUsuario and e.pausada ? null : 'every 1s'},
		data-gols=${e.golsNaDivisao()}, data-divisao=${e.divisaoAtual}, data-som=${e.somGols}"
	hx-select="#quadro" hx-swap="outerHTML">

<header class="clube-topo" th:with="atual=${e.divisoes[e.divisaoAtual]}">
<div class="pilha-curta">
<span class="rotulo" th:text="|Temporada ${e.temporada}|">Temporada 1</span>
<h1 class="titulo-pagina" th:text="${e.copa != null ? e.copa : 'Rodada ' + e.rodada}">Rodada 1</h1>
</div>
<nav aria-label="Divisões da rodada, na ordem em que jogam" class="etapas">
<span th:each="d : ${e.divisoes}" class="etapa" th:classappend="${d.situacao.name() == 'JOGANDO'} ? 'jogando' : (${d.situacao.name() == 'TERMINADA'} ? 'terminada')"
	th:text="|${d.nome} · ${d.situacao.name() == 'JOGANDO' ? 'jogando' : (d.situacao.name() == 'TERMINADA' ? 'terminada' : 'aguardando')}|">Divisão · jogando</span>
</nav>
<div class="relogio">
<span class="relogio-minuto" th:text="|${e.minuto}'|">0'</span>
<div class="relogio-barra" role="img" th:attr="aria-label=|${e.minuto} de ${e.minutos} minutos|">
<div th:style="|width: ${e.minuto * 100 / e.minutos}%|"></div>
</div>
</div>
</header>

<div class="controles-rodada">
<form th:if="${e.comUsuario}" th:action="@{/jogos/{id}/rodada/velocidade(id=${e.jogoId})}" method="post"
	class="velocidades" role="group" aria-label="Velocidade da partida"
	hx-boost="true" hx-target="#quadro" hx-select="#quadro" hx-swap="outerHTML">
<button th:each="v : ${velocidades}" type="submit" name="velocidade" th:value="${v.name()}" class="velocidade"
	th:attr="aria-pressed=${v == e.velocidade}"
	th:text="${v.name() == 'LENTA' ? 'Lenta' : (v.name() == 'NORMAL' ? 'Normal' : 'Rápida')}">Normal</button>
</form>
<form th:action="@{/jogos/{id}/rodada/som(id=${e.jogoId})}" method="post"
	hx-boost="true" hx-target="#quadro" hx-select="#quadro" hx-swap="outerHTML">
<input type="hidden" name="ligado" th:value="${!e.somGols}">
<button type="submit" class="botao-som" data-ativar-som th:attr="aria-pressed=${e.somGols}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"></path><path th:if="${e.somGols}" d="M15.5 8.5a5 5 0 0 1 0 7"></path><path th:if="${e.somGols}" d="M19 5a10 10 0 0 1 0 14"></path><path th:unless="${e.somGols}" d="M22 9l-6 6"></path><path th:unless="${e.somGols}" d="M16 9l6 6"></path></svg>
<span th:text="${e.somGols} ? 'Som dos gols ligado' : 'Som dos gols desligado'">Som</span>
</button>
</form>
</div>

<div th:if="${e.comUsuario and e.pausada and janela == null}" role="status" class="aviso-pausa">
<span>Partida pausada.</span>
<form th:action="@{/jogos/{id}/rodada/continuar(id=${e.jogoId})}" method="post">
<button type="submit" class="botao">Continuar</button>
</form>
</div>

<section th:with="atual=${e.divisoes[e.divisaoAtual]}" th:attr="aria-label=${atual.nome}" class="painel grupo">
<div class="painel-cabecalho">
<h2 class="titulo-secao pequeno" th:text="${atual.nome}">Divisão</h2>
<span class="suave" th:text="|${e.comUsuario and e.pausada ? 'Pausada' : 'Ao vivo'} · ${e.partidas.size()} ${e.partidas.size() == 1 ? 'jogo' : 'jogos'}|">Ao vivo</span>
</div>
<div class="tabela-rolagem">
<div class="jogos-rodada">
<div th:each="j : ${e.partidas}" class="jogo-linha" th:classappend="${j.doUsuario} ? 'do-usuario'">
<span class="jogo-publico" th:text="${#numbers.formatInteger(j.publico, 1, 'POINT')}" th:attr="aria-label=|Público ${#numbers.formatInteger(j.publico, 1, 'POINT')}|">0</span>
<div class="jogo-clube mandante">
<span th:if="${j.expulsaoCasa}" class="cartao vermelho" role="img" aria-label="Expulsão"></span>
<form th:if="${e.comUsuario}" th:action="@{/jogos/{id}/rodada/janela(id=${e.jogoId})}" method="post" class="clube-clicavel">
<input type="hidden" name="mandante" th:value="${j.mandante.id}">
<button type="submit" class="jogo-nome" th:text="${j.mandante.nome}" th:attr="aria-label=|${j.mandante.nome}: pausar e ver o jogo|">Mandante</button>
</form>
<span th:unless="${e.comUsuario}" class="jogo-nome" th:text="${j.mandante.nome}">Mandante</span>
<span aria-hidden="true" th:style="${@escudos.estilo(j.mandante.escudo, 22, 26)}"></span>
</div>
<div class="placar" th:attr="aria-label=|${j.golsCasa} a ${j.golsFora}${j.penaltisCasa != null ? ', pênaltis ' + j.penaltisCasa + ' a ' + j.penaltisFora : ''}|">
<span th:text="${j.golsCasa}">0</span><span th:text="${j.golsFora}">0</span>
</div>
<div class="jogo-clube">
<span aria-hidden="true" th:style="${@escudos.estilo(j.visitante.escudo, 22, 26)}"></span>
<form th:if="${e.comUsuario}" th:action="@{/jogos/{id}/rodada/janela(id=${e.jogoId})}" method="post" class="clube-clicavel">
<input type="hidden" name="mandante" th:value="${j.mandante.id}">
<button type="submit" class="jogo-nome" th:text="${j.visitante.nome}" th:attr="aria-label=|${j.visitante.nome}: pausar e ver o jogo|">Visitante</button>
</form>
<span th:unless="${e.comUsuario}" class="jogo-nome" th:text="${j.visitante.nome}">Visitante</span>
<span th:if="${j.expulsaoFora}" class="cartao vermelho" role="img" aria-label="Expulsão"></span>
</div>
<span class="ultimo-lance">
<span th:if="${j.penaltisCasa != null}" class="lance-texto" th:text="|Pênaltis ${j.penaltisCasa} x ${j.penaltisFora}|">Pênaltis 4 x 3</span>
<th:block th:if="${j.penaltisCasa == null and j.ultimoLance != null}">
<span class="lance" th:classappend="${@lances.icone(j.ultimoLance)}" role="img"
	th:with="tipo=${j.ultimoLance.tipo.name()}"
	th:attr="aria-label=${tipo == 'GOL' ? 'Gol' : (tipo == 'CARTAO_AMARELO' ? 'Cartão amarelo' : (tipo == 'LESAO' ? 'Lesão' : 'Expulsão'))}"></span>
<span class="lance-texto" th:text="${@lances.texto(j.ultimoLance)}">Nome 41'</span>
</th:block>
</span>
</div>
</div>
</div>
</section>

<footer class="rodape-rodada suave">
<span th:text="${e.comUsuario} ? 'A linha mostra o último lance. Clique num clube para pausar e ver todos os lances; no seu clube, também as substituições.' : (${e.copa != null} ? 'Seu clube não joga esta etapa da copa: os jogos correm rápido.' : 'Nenhum clube desta divisão é seu: os jogos correm sempre rápido.')">texto</span>
<span th:text="${e.divisaoAtual == e.divisoes.size() - 1} ? 'Ao fim desta divisão você volta ao plantel.' : 'Ao terminar, começa a próxima divisão.'">texto</span>
</footer>

<th:block th:if="${janela != null}"><div th:replace="~{janela :: janela}"></div></th:block>
</div>

</div>
</div>
</body>
</html>
